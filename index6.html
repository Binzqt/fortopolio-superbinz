<style>
    .skills-container {
        max-width: 850px;
        margin:  auto;
       
    }

    .skills-container h2 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 30px;
        color: #000000;
    }

    .skill {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 26px;
    }

    .skill-name {
        font-size: 22px;
        font-weight: 500;
        color: #000000;
        flex-basis: 10%;
    }

    .progress-bar-container {
        flex-grow: 1;
        height: 30px;
        background-color: #2f2f2f;
        border-radius: 15px;
        margin: 0 30px;
    }

    .progress-bar {
        height: 100%;
        background-color: #45b749;
        border-radius: 15px;
        width: 0%;
        animation: progress-bar-animation 1s ease-out forwards;
    }

    .golo {
  width: 50px; /* Atur ukuran logo */
  height: auto; /* Proporsi logo tetap */
  display: block; /* Menghapus jarak di bawah logo */
  margin: 0px auto; /* Pusatkan logo (opsional) */
}

    @keyframes progress-bar-animation {
        0% {
            width: 0%;
        }

        100% {
            width: attr(style, 'width');
        }
    }

    .skill-percentage {
        font-size: 20px;
        font-weight: 500;
        color: #000000;
        flex-basis: 5%;
        text-align: right;
    }

    @media (max-width: 768px) {
        .skills-container {
            padding: 40px 20px;
        }

        .skills-container h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .skill {
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .skill-name,
        .skill-percentage {
            flex-basis: auto;
        }

        .progress-bar-container {
            width: 100%;
            margin: 10px 0;
        }
    }
</style>
